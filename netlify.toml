# Netlify builds the site rather than serving the repo directly. Until now the
# repo *was* the site; from here the repo is the source and _site is the site.
#
# Nothing about the published URLs changes: eleventy.config.js keeps the flat
# about.html filenames rather than Eleventy's default about/index.html, so the
# canonicals, the sitemap and the address bar still agree with each other.

[build]
  # Called by path rather than through npx. The project folder on this machine
  # is "Ava Bright:ATD", and a colon is the PATH separator — so the directory npm
  # prepends for node_modules/.bin gets split in half and "eleventy" is not
  # found. Netlify checks out to a path with no colon in it, so npx would work
  # here, but there is no reason for the two to differ.
  command = "./node_modules/.bin/eleventy"
  publish = "_site"

[build.environment]
  # Pin it. A site that builds today and fails in four months because Netlify
  # moved its default Node version is the kind of thing that goes wrong while
  # nobody is looking at it.
  NODE_VERSION = "22"

# The old domain is paid up until August 2027 and still points here, so anyone
# holding an old business card, an old link, or the URL Google still has
# indexed lands somewhere real rather than on a dead name.
#
# It needs these rules to actually redirect. Netlify serves a domain alias
# directly instead of redirecting it, which leaves the identical site
# reachable at two addresses — duplicate content, and whatever link equity the
# old name earned stranded on a domain nobody is meant to use any more. A 301
# hands that across to the new name instead, which is the whole reason for
# keeping the registration alive.
#
# force = true is the part that matters. Without it the alias wins: Netlify
# finds a real file at that path, serves it, and never reaches the rule.

[[redirects]]
  from = "https://attentiontodetailwa.com/*"
  to = "https://brightdetailswa.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.attentiontodetailwa.com/*"
  to = "https://brightdetailswa.com/:splat"
  status = 301
  force = true
