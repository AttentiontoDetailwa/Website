<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Attention to Detail">
  <!--
    Her mark on the ink ground, which puts the cyan in its "type on ink" role
    rather than its "fill on cream" one — the same rule the header follows.
    Two of the header mark's five paths are dropped here: the ground stubs
    either side and the window lines. At 16px in a browser tab they close up
    into a smudge, and what has to survive that size is the silhouette and the
    two wheels. Stroke is 2.6 rather than the header's 1.6 for the same reason.
  -->
  <rect width="64" height="64" rx="13" fill="#0A0D0E"/>
  <g transform="translate(6.2 18.6) scale(0.8)"
     fill="none" stroke="#85E5E8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 24c0-3 2.4-5.4 5.4-5.4S19.8 21 19.8 24 17.4 29.4 14.4 29.4 9 27 9 24Z"/>
    <path d="M44 24c0-3 2.4-5.4 5.4-5.4S54.8 21 54.8 24s-2.4 5.4-5.4 5.4S44 27 44 24Z"/>
    <path d="M19.8 24h24.4"/>
    <path d="M4 21c1-5.5 3-8 6-8.6l9-5.2c2-1.2 4.3-1.6 6.6-1.2l14 2.6c2 .4 3.8 1.4 5.2 2.9l4.4 4.6 8 1.8c3 .7 4.8 2.5 4.8 5"/>
  </g>
</svg>
